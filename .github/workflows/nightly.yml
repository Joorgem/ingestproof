# .github/workflows/nightly.yml
#
# The nightly ring (spec section 7.2): minutes rather than seconds, Linux only, and
# everything that needs a JVM or a big file. The inner ring must never grow a JVM step --
# the declaration layer not importing Spark is what keeps a turn fast.
name: nightly

on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  CI: "true"

jobs:
  traceability:
    name: OpenFastTrace
    runs-on: ubuntu-latest
    steps:
      # The node20 runtime is deprecated, and THE MAJOR THAT FIXES IT DIFFERS PER ACTION --
      # checked one by one, not bumped by pattern: setup-java v5 is node24, but
      # upload-artifact v5 is still node20 and only v6 moves. Each pin here is the FIRST
      # major that clears the deprecation, adopting no unrelated behaviour change.
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # setup-uv stopped publishing floating major tags after v7: `@v10` does not
      # resolve and the run fails at "Set up job". v10.0.1 is the exact v10 release.
      - uses: astral-sh/setup-uv@v10.0.1
        with: { python-version: "3.12" }
      - run: uv sync --all-groups
      # P0 REPORTS, it does not gate: `src/` is one __version__ line, so every criterion is
      # legitimately uncovered and a gate here would only be a red light nobody can fix.
      # P1 removes `continue-on-error` in the same turn that lands the first `[impl->...]` tag.
      - name: Trace
        continue-on-error: true
        run: uv run python -m tools.oft
      # This one BLOCKS, and deliberately so. tools/spec_parse is narrower than OFT, so an
      # item in any other OFT-legal form is visible to the JAR and invisible to the inner
      # ring -- unhashed and never Needs-checked. The counts agreeing is the only thing
      # watching that gap, and unlike coverage it is already true today.
      - name: The JAR and the parser see the same items
        run: uv run python -m tools.oft check-counts
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: oft-report, path: oft-report.txt }

  corpus:
    name: corpus pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with: { python-version: "3.12" }
      - run: uv sync --all-groups
      - name: Cache the pinned corpus between nights
        # v5, not v4, and the rule above is what picks it: fetched action.yml at each tag
        # and v4 is `using: node20` -- the deprecated one. v5 is node24, v6 is node24 as
        # well but is not the FIRST major that clears it, so it would carry unrelated
        # behaviour change into a file whose pins are chosen one by one.
        uses: actions/cache@v5
        with:
          path: ~/.ingestproof-corpus
          # The key is the pin itself: change the month or the hash and the cache misses,
          # which is the only correct behaviour when the corpus identity changes.
          key: corpus-2026-06-76dbe5d9
      # 366 MB over a shared link. Nightly, cached, and never in the inner ring.
      - name: Fetch and verify
        run: uv run python -m tools.fetch_corpus
